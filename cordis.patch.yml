# @log.li/dsh-memory bundle layer（fork of dsh-plugin-memory）。
#
# Declared via the `dsh.bundle.patch` manifest in package.json, so
# `dsh plugin add @log.li/dsh-memory`（本 fork 用 link: 安装，见 README）
# mounts this insert automatically. User-level overrides — including the
# hot-editable `enabled` / `memoryDir` / `autoInject` / `deferUntilUserSpeaks`
# / `activeSessionOnly` / `registerSkill` — live in <dshHome>/memory.json,
# managed by the settings panel.
- insert:
    - id: dsh-memory
      name: '@log.li/dsh-memory'
